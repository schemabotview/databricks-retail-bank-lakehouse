# Global Bank's lakehouse, as one bundle: the code, the pipeline, the nightly
# job and the dashboard, deployed together from the repo.
bundle:
  name: globalbank

include:
  - resources/*.yml

variables:
  warehouse_id:
    lookup: {warehouse: Serverless Starter Warehouse}
  catalog:
    default: globalbank_dev

targets:
  dev:
    mode: development  # schedules and triggers paused
    default: true
    presets: {name_prefix: "dev_${workspace.current_user.short_name}_"}
